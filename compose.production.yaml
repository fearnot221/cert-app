# Preparation overlay, not a claim of production readiness. Requires Docker Compose >=2.24.4.
# Phase 1 intentionally keeps all external mail disabled.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    ports: !reset []
  redis:
    ports: !reset []
  mailpit:
    profiles: [development]
    ports: !reset []
  migrate:
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${DOCKER_APP_ORIGIN:?Set the canonical HTTPS origin}
      SESSION_SECRET: ${SESSION_SECRET:?Set a private session secret}
      MAIL_MODE: disabled
  api:
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${DOCKER_APP_ORIGIN:?Set the canonical HTTPS origin}
      SESSION_SECRET: ${SESSION_SECRET:?Set a private session secret}
      MAIL_MODE: disabled
  worker:
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${DOCKER_APP_ORIGIN:?Set the canonical HTTPS origin}
      SESSION_SECRET: ${SESSION_SECRET:?Set a private session secret}
      MAIL_MODE: disabled
  web:
    ports: !reset []
  caddy:
    # Terminates HTTPS for APP_DOMAIN with an automatic Let's Encrypt certificate.
    image: caddy:2.10.2-alpine
    command: ["caddy", "reverse-proxy", "--from", "${APP_DOMAIN:?Set the public domain, e.g. cert.example.com}", "--to", "web:8080"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped
  create-admin:
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${DOCKER_APP_ORIGIN:?Set the canonical HTTPS origin}
      SESSION_SECRET: ${SESSION_SECRET:?Set a private session secret}
      MAIL_MODE: disabled
  seed:
    environment:
      NODE_ENV: production
      MAIL_MODE: disabled
      SEED_ADMIN_PASSWORD: ''

volumes:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true

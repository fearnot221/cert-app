name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated local services
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis mailpit
          docker compose exec -T postgres createdb -U cert cert_app_test
      - run: pnpm db:generate
      - name: Allow Chromium sandbox (Ubuntu 24.04 AppArmor userns restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm lint
      - name: Deployment webhook regression tests
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py' -v
      - run: pnpm typecheck
      - name: Unit and real Chromium renderer tests
        env:
          RENDERER_INTEGRATION: '1'
        run: pnpm test
      - name: Integration tests on dedicated test database
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://cert:cert_local_only@localhost:55432/cert_app_test
        run: |
          pnpm db:migrate
          pnpm test:integration
      - run: pnpm build
      - name: Browser E2E with local Mailpit
        env:
          CI: 'true'
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm test:e2e
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100 postgres redis mailpit
      - name: Stop disposable CI services
        if: always()
        run: docker compose down --volumes --remove-orphans

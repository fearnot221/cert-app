packages:
  - apps/*
  - packages/*
allowBuilds:
  msgpackr-extract: false
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.1'
  - bullmq@6.3.15
  - nodemailer@10.1.1
  - playwright-core@1.64.1
  - playwright@1.64.1
  - react-dom@19.3.1
  - react@19.3.1
